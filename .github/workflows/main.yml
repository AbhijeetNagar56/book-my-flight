name: BMF CI/CD Pipeline

on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install & Test
        run: |
          npm run build
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/abhijeetnagar56/book-my-flight:latest
            ghcr.io/abhijeetnagar56/book-my-flight:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - name: Trigger Render Redeploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}"




            
